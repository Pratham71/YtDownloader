[project]
name = "ytdl"
version = "0.3.0"
description = "A clean, cross-platform YouTube downloader CLI"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "rich",
    # curl-cffi lets yt-dlp look like a browser, which TikTok, Vimeo, and others require.
    "yt-dlp[default,curl-cffi]>=2026.10.26",
]

[project.urls]
Homepage = "https://github.com/Pratham71/YtDownloader"

[project.scripts]
ytdl = "ytdl.cli:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytdl"]
