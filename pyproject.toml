[project]
name = "yt-downloader"
version = "0.1.0"
description = "A clean YouTube downloader CLI"
readme = "readme.md"
requires-python = ">=3.12"

dependencies = [
    "moviepy",
    "rich",
    "youtube-search-python",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
yt-downloader = "yt_downloader.cli:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_downloader"]
